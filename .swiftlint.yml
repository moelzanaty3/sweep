# Only rules that genuinely fight this codebase's conventions are off; everything
# else is fixed in the source rather than silenced here.
included:
  - Sources
  - Tests

disabled_rules:
  - todo
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 900

function_body_length:
  warning: 80
  error: 140

# SwiftUI view builders nest deeply by nature; the default of 5 flags ordinary
# layout code.
cyclomatic_complexity:
  warning: 20
  error: 30

identifier_name:
  min_length: 1
  excluded: [id, x, y, w, h, up, s]

nesting:
  type_level: 3
