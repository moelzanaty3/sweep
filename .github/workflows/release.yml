name: Build Release Artifacts

on:
  # Called by release-please.yml. A release created with the default
  # GITHUB_TOKEN cannot trigger another workflow, so the chain is explicit
  # rather than event-driven.
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}

      - run: swift --version

      - name: Build app
        run: bash build.sh

      # Signing is skipped until the secrets exist, so this workflow still
      # produces a build while Developer Program enrollment is pending.
      - name: Import signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing certificate configured — producing an ad-hoc build."
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sign, notarize and package
        if: steps.signing.outputs.signed == 'true'
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials sweep \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
          bash build.sh notarize

      - name: Package unsigned
        if: steps.signing.outputs.signed != 'true'
        run: bash build.sh dmg

      - name: Checksum
        run: cd dist && shasum -a 256 *.dmg | tee checksums.txt

      - name: Attach artifacts to the release
        if: inputs.tag != '' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.dmg dist/checksums.txt --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Sweep-dmg
          path: dist/*.dmg

  # The DMG is not reproducible - hdiutil stamps it - so the cask checksum has
  # to come from the artifact that was actually published, never from a local
  # build. Skipped when TAP_TOKEN is absent.
  homebrew:
    needs: build
    if: inputs.tag != '' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set - skipping cask update."
            exit 0
          fi
          VERSION="${TAG#v}"
          URL="https://github.com/$REPO/releases/download/$TAG/Sweep-$VERSION.dmg"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | cut -d" " -f1)
          echo "$TAG -> $SHA"

          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/${{ github.repository_owner }}/homebrew-tap.git" tap
          cd tap
          sed -i -E "s/^  version \"[^\"]+\"/  version \"$VERSION\"/" Casks/sweep.rb
          sed -i -E "s/^  sha256 \"[^\"]+\"/  sha256 \"$SHA\"/" Casks/sweep.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sweep $VERSION" && git push
